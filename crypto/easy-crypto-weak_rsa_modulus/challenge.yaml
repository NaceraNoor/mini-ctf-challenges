Difficulty: easy
Category: cryptography
Theme: small modulus in RSA

Description: 
A web server is using hybrid encryption to communicate with its client: RSA for encrypting the AES key and then AES for encrypting the data. Here is the RSA public key of the website (e, some weak n). We intercepted the encrypted key and encrypted data. Can you decipher the key and get the plain data ?
You can find the public RSA key, the encrypted key, nonce and encrypted data in: dist/data.txt
Format: The numbers n, e and the AES key are decimal integers. The nonce and the encrypted data are hex encoded. Don't forget to encode the plain data to utf-8.

