<!doctype html>
<html>
<head>
  <title>My Profile</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
  {% if user["is_admin"] == 1%}
    <h1>{{ flag }}</h1>
  {% endif %}
  <h1>Welcome, {{ user["username"] }}</h1>
  <p>You're logged in. Feel free to look around, there might be some interesting info to find.</p>

  <a href="{{ url_for('login_infos') }}">
    <button>Session Info</button>
  </a>
  <a href="{{ url_for('logout') }}">
    <button>Logout</button>
  </a>
  </main>
</body>
</html>
